name: Build X86 Stock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.X86_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.X86_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/x86-release.jks"

      - name: Build signed Release APK
        env:
          X86_KEYSTORE_PATH: ${{ runner.temp }}/x86-release.jks
          X86_KEYSTORE_PASSWORD: ${{ secrets.X86_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/x86-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X86-Stock-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
