name: Build X86 Stock APK

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Build a signed test candidate from this trusted branch
        type: boolean
        default: false
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify APK identity checker
        run: |
          bash scripts/tests/verify-apk-identity.sh
          node scripts/tests/legacy-navigation.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Supplied module frontend regression
        run: |
          npm ci --prefix tests/web
          npm test --prefix tests/web
      - name: Unit tests, lint and debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Upload development APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X86-Stock-Development-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error

  server-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unchanged PHP with isolated synthetic MariaDB
        run: bash tests/server/run.sh

  webview-tests:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload WebView test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebView-Tests-API-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  build:
    needs: [verify, webview-tests, server-regression]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.sign_release)
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.X86_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.X86_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/x86-release.jks"

      - name: Build signed Release APK
        env:
          X86_KEYSTORE_PATH: ${{ runner.temp }}/x86-release.jks
          X86_KEYSTORE_PASSWORD: ${{ secrets.X86_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIGNATURE=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE"
          printf '%s\n' "$SIGNATURE" | grep -q 'Signer #1 certificate SHA-256 digest: be82abd27b1e50b9537046d4993c3440cc14a41d971bf120c5e96d2c0c46956f' 

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/x86-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X86-Stock-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
