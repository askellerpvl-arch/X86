name: Build X86 Stock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          rm -rf X86Stock-Android
          unzip -q X86Stock-Android-project-v1.5.zip

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.X86_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret X86_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/x86-release.jks"

      - name: Build signed Release APK
        env:
          X86_KEYSTORE_PATH: ${{ github.workspace }}/x86-release.jks
          X86_KEYSTORE_PASSWORD: ${{ secrets.X86_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$X86_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret X86_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi
          cd X86Stock-Android
          gradle :app:assembleRelease --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/x86-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X86-Stock-Release-APK
          path: X86Stock-Android/app/build/outputs/apk/release/app-release.apk
