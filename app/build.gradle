plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("X86_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("X86_KEYSTORE_PASSWORD")

android {
    buildFeatures { buildConfig true }
    namespace 'kz.x86.stock'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'kz.x86.stock'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath && releaseKeystorePassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'x86-release'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystorePath && releaseKeystorePassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}


dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
